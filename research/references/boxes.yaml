# Volume boxes: a Coney game reference list. The page docs/references/boxes.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Volume boxes"
about: |
  The axis-aligned boxes level scripts add with `AddVolumeBox(name, kind, corner, size)` to test
  whether humans are inside an area, switch collision and mark a gang's turf (`GangAddTurfBox`).
  The kind picks the class: 0 a `VolumeBox`, 2 a `PlayerBox`, 3 a `TurfBox`
  ([Tasks](../research/tasks.md#classes)).
complete: |
  Every `AddVolumeBox` call whose name is a literal string: {count} boxes (547 volume, 251 player and 176
  turf boxes) in 47 levels. *Held in* and *Turf of* are filled where a script keeps the handle in a global: 64 of
  the 87 `GangAddTurfBox` calls resolve to a box. What a player box does differently from a volume box is not
  traced.
defaults: {source: "the level scripts, AddVolumeBox and GangAddTurfBox", evidence: inferred}
