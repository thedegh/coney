# Animation clips: a Coney game reference list. The page docs/references/animations.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Animation clips"
about: |
  Every distinct animation clip on the disc: its name (from its descriptor), length, root
  displacement and where it is found ([Animation](../research/formats/animation.md)). Clips that share a
  name but differ are numbered `#2`, `#3` ...
complete: |
  Every clip ({count}) is listed. Resource names are recovered by hashing; unnamed ones show as hex.
defaults: {source: "character data and .anm resources, clip descriptors", evidence: confirmed-code}
