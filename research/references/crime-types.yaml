# Crime types: a Coney game reference list. The page docs/references/crime-types.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Crime types"
about: |
  The crimes the police respond to. Scripts report one with `CrimeIsHappening` or
  `SpawnCustomCrime`, set how many responders each type draws with `CfgCrimeResponders` and switch one with
  `CfgEnableCrimeType`; the game reports others itself ([AI: crimes](../research/ai.md#crimes)).
complete: |
  All {count} types are listed. The names come from a table no code calls, so which name goes with
  which number is inferred from the types the code raises.
defaults: {source: "SLUS_212.15, crime report 0x0041b8b0 and crime-name table 0x0041d2c0", evidence: confirmed-code}
entries:
