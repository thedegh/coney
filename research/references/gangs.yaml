# Gangs: a Coney game reference list. The page docs/references/gangs.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: Gangs
about: |
  Gang types: `CfgGang(type, ...)` configures each, `GangCreate(type, name)` creates a gang in a
  level script and `CfgGangMusic` gives it three music tracks. Humans join a gang when they are created.
complete: |
  Every gang type ({count}) is listed with its arguments; the meaning of the byte values is not traced.
  Labels are hand-written.
defaults: {source: "config_preload2.lua, CfgGang", evidence: inferred}
