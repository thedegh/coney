# Doors: a Coney game reference list. The page docs/references/doors.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: Doors
about: |
  Every door level scripts spawn with `SpawnDoor(type, pos, rot, {triangle1, triangle2}, number)`
  ([World objects: doors](../research/objects.md#doors)). The number was thought to be a lock kind; it is
  the door's number in its level, which ties the level's navigation links to the door.
complete: |
  Every `SpawnDoor` call ({count} doors in 45 levels). The number's links: an AI charges through a
  kind-`0x40` link, and opening or breaking the door clears their avoid bit
  ([Navigation links](../research/objects.md#nav-links)). Hitpoints and states per door type are on
  [World objects](../research/objects.md#door-states).
defaults: {source: "the level scripts, SpawnDoor", evidence: confirmed-code}
