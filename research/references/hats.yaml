# Hat fittings: a Coney game reference list. The page docs/references/hats.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Hat fittings"
about: |
  Where each hat sits on each Warrior. `CfgHat(set, type, hat, {x, y, z}, {i, j, k, r})` adds one fitting to a hat-fit
  set, a 0xa90-byte record at `0x00662b70 + set × 0xa90` with 48 hat slots, owned by one character type. When a human
  whose class has brain kind 3 (the Warriors) wears a hat, the hat is placed by the set of the type it was created as
  (human `+0xd0`), else by the set of its class (`+0xcc`), at the fitting whose name is the hat's; every other human
  uses the hat model's own attach point (`0x003a3ba0`). The hats are [objects](objects.md);
  [Characters: hats](../research/characters.md#hats).
complete: |
  All {count} fittings of `config_preload2.lua` are listed: 28 sets, one per Warriors model, 14 to 43 hats each. A hat that
  is in no slot of a wearer's set gets a default transform. Each hat shows its object's image where it has one.
defaults: {source: "config_preload2.lua, CfgHat", evidence: confirmed-code}
