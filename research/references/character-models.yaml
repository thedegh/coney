# Character models: a Coney game reference list. The page docs/references/character-models.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Character models"
about: |
  The Character List in `warriors.glr`: one record per character model, naming its model, texture
  dictionary and character data (animations) by hash ([Characters](../research/characters.md#files)). A
  `<model>_a` record is the variant used in levels 60-64.
complete: |
  Every record ({count}) is listed. Names are recovered by hashing candidate strings; a record
  without a name has none of its candidates on the disc yet.
defaults: {source: "warriors.glr, Character List (chunk 0x44)", evidence: confirmed-code}
