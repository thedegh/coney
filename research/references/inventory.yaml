# Inventory items: a Coney game reference list. The page docs/references/inventory.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Inventory items"
about: |
  The 23 item slots of each player's inventory, ids 0-22 (`0x0041e420`). `CfgInventoryItem(object,
  id, count, sound, ms)` gives a slot its object, pickup sound and duration in both players'
  inventories; `InvGiveItem(id, n)` adds to a player's count, `InvNumberOf(id)` reads it and
  `HuPutItemInPocket(human, id, n)` puts an item in a human's pocket (human `+0x250`, the count at
  `+0x254`), to be taken when the human is beaten or mugged.
complete: |
  All {count} slots are listed; 15 have an object in `config_preload2.lua` and `level20` reconfigures three. Slots 0 and
  16-22 have no object and no script names them. What an item is comes from its object's name and its bindings
  (inferred); what the duration does for each item is not traced.
defaults: {source: "config_preload2.lua, CfgInventoryItem; the Inv bindings", evidence: confirmed-code}
