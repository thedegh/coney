# Glass types: a Coney game reference list. The page docs/references/glass-types.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Glass types"
about: |
  The breakable-glass types: `CfgSetGlassProperties(type, windowLink, alarm, sprite, brokenSprite)`
  configures each in `config_preload2.lua`, and a level script places panes with
  `SpawnBreakableGlass(type, corner, cornerU, cornerV, uv0, uv1, 0, triangle1, triangle2)`
  ([World objects: glass](../research/objects.md#glass)).
complete: |
  All {count} types are listed with every argument. Any hit breaks a pane (no hitpoints); what breaking
  does is on [World objects: a pane's life](../research/objects.md#pane). The sprite words' low halves
  are rectangles of `part_page1`, the sheet of sprite batch 0 that every pane but type 14 draws from; their
  high halves are ignored ([World objects: drawing a pane](../research/objects.md#pane-draw)).
defaults: {source: "config_preload2.lua, CfgSetGlassProperties; SpawnBreakableGlass in the scripts", evidence: confirmed-code}
