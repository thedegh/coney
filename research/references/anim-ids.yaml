# Anim ids: a Coney game reference list. The page docs/references/anim-ids.md is generated
# from this file by `coney-tools refs render`; `coney-tools refs extract` refreshes the fields read from the
# disc and keeps the hand-written ones. Schema and rules: docs/guides/research-workflow.md#reference-lists.
title: "Anim ids"
about: |
  The 722 anim ids every character data maps to clips. A character's own slot wins; an unset slot
  plays the generic character data's clip ([Characters](../research/characters.md#files)). Scripts name ids
  with the `ANIM_*` constants of `royal.lua`; the locomotion slots are
  [Characters, Anim slots](../research/characters.md#anim-slots).
complete: |
  All {count} ids are listed with the generic clip and Rembrandt's own clip where he has one. Names
  exist only for the ids `royal.lua` defines.
defaults: {source: "royal.lua (names); character data (clips); 0x005105d8 (slots)", evidence: inferred}
